version: '3'

vars:
  GO: '{{.GO | default "go"}}'
  GOLANGCI: '{{.GOLANGCI | default "golangci-lint"}}'
  WORKFLOW: 'go run ./tools/workflow/main.go'

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list

  check:
    desc: Run every quality gate (fmt + vet + lint + test)
    cmds:
      - task: fmt
      - task: vet
      - task: lint
      - task: test
      - task: test:workflow

  test:workflow:
    desc: Test the workflow tool
    cmds:
      - '{{.GO}} test -C tools/workflow ./...'

  fmt:
    desc: Format Go code
    cmds:
      - '{{.GO}} fmt ./...'

  vet:
    desc: Run go vet
    cmds:
      - '{{.GO}} vet ./...'

  lint:
    desc: Run golangci-lint
    cmds:
      - '{{.GOLANGCI}} run'

  test:
    desc: Run Go tests
    cmds:
      - '{{.GO}} test ./...'

  build:
    desc: Build all packages
    cmds:
      - '{{.GO}} build ./...'

  run:
    desc: Run the gateway
    cmds:
      - '{{.GO}} run ./cmd/gateway'

  tidy:
    desc: Tidy go.mod
    cmds:
      - '{{.GO}} mod tidy'

  verify:
    desc: Validate workflow artifacts (frontmatter, dependencies, indexes)
    cmds:
      - '{{.WORKFLOW}} verify'

  plan:sync:
    desc: Regenerate plan ticket indexes from ticket frontmatter
    cmds:
      - '{{.WORKFLOW}} plan-sync'

  adr:index:
    desc: Regenerate docs/adr/README.md
    cmds:
      - '{{.WORKFLOW}} adr-index'

  ticket:start:
    desc: 'Start a ticket: task ticket:start id=... [plan=...]'
    requires:
      vars: [id]
    cmds:
      - '{{.WORKFLOW}} ticket-start "{{.id}}" "{{.plan | default ""}}"'

  ticket:close:
    desc: 'Close a ticket: task ticket:close id=... [plan=...]'
    requires:
      vars: [id]
    cmds:
      - '{{.WORKFLOW}} ticket-close "{{.id}}" "{{.plan | default ""}}"'

  hooks:install:
    desc: Install git hooks (sets core.hooksPath to .githooks)
    cmds:
      - git config core.hooksPath .githooks

  verify:commits:
    desc: 'Validate commit messages in a range (default: HEAD)'
    cmds:
      - '{{.WORKFLOW}} verify-commits "{{.range | default ""}}"'

  changelog:
    desc: Regenerate CHANGELOG.md with git-cliff
    cmds:
      - git-cliff -o CHANGELOG.md

  new-adr:
    desc: 'Create an ADR: task new-adr title="..."'
    requires:
      vars: [title]
    cmds:
      - 'bash scripts/new-adr.sh "{{.title}}"'

  new-plan:
    desc: 'Create a plan: task new-plan name=... title="..."'
    requires:
      vars: [name]
    cmds:
      - 'bash scripts/new-plan.sh "{{.name}}" "{{.title | default .name}}"'

  new-ticket:
    desc: 'Create a ticket: task new-ticket plan=... title="..."'
    requires:
      vars: [plan, title]
    cmds:
      - 'bash scripts/new-ticket.sh "{{.plan}}" "{{.title}}"'

  new-diary:
    desc: 'Create a diary entry: task new-diary slug=...'
    cmds:
      - 'bash scripts/new-diary.sh "{{.slug | default "session"}}"'
