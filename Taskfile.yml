version: '3'

vars:
  GO: '{{.GO | default "go"}}'
  GOLANGCI: '{{.GOLANGCI | default "golangci-lint"}}'
  WORKFLOW: 'go run ./tools/workflow/main.go'

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list

  check:
    desc: Run every quality gate (fmt + vet + lint + test)
    cmds:
      - task: fmt
      - task: vet
      - task: lint
      - task: test
      - task: test:workflow

  check:ci:
    desc: Full CI gate (check + verify + console + govulncheck)
    cmds:
      - task: check
      - task: verify
      - task: console
      - task: govulncheck

  test:workflow:
    desc: Test the workflow tool
    cmds:
      - '{{.GO}} test -C tools/workflow ./...'

  govulncheck:
    desc: Scan dependencies for known vulnerabilities
    cmds:
      - govulncheck ./...

  coverage:
    desc: 'Run tests with coverage and enforce a floor (COVERAGE_MIN, default 60)'
    vars:
      MIN: '{{.COVERAGE_MIN | default "60"}}'
    cmds:
      - 'if [ "$({{.GO}} env CGO_ENABLED)" = "1" ]; then {{.GO}} test -race -coverprofile=coverage.out -covermode=atomic ./...; else {{.GO}} test -coverprofile=coverage.out -covermode=atomic ./...; fi'
      - '{{.WORKFLOW}} coverage coverage.out {{.MIN}}'

  console:
    desc: Lint and typecheck the console (no-op when apps/console is absent)
    cmds:
      - |
        if [ ! -d apps/console ]; then
          echo "console: apps/console not present, skipping"
          exit 0
        fi
        cd apps/console
        if [ ! -d node_modules ]; then npm ci; fi
        npx eslint .
        npx tsc --noEmit

  fmt:
    desc: Format Go code
    cmds:
      - '{{.GO}} fmt ./...'

  vet:
    desc: Run go vet
    cmds:
      - '{{.GO}} vet ./...'

  lint:
    desc: Run golangci-lint
    cmds:
      - '{{.GOLANGCI}} run'

  test:
    desc: Run Go tests (with the race detector when cgo is available)
    cmds:
      - 'if [ "$({{.GO}} env CGO_ENABLED)" = "1" ]; then {{.GO}} test -race ./...; else {{.GO}} test ./...; fi'

  build:
    desc: Build all packages (injects the version)
    cmds:
      - 'V=$({{.WORKFLOW}} version) {{.GO}} build -ldflags "-X main.version=$V" ./...'

  run:
    desc: Run the gateway
    cmds:
      - '{{.GO}} run ./cmd/gateway'

  tidy:
    desc: Tidy go.mod
    cmds:
      - '{{.GO}} mod tidy'

  verify:
    desc: Validate workflow artifacts (frontmatter, dependencies, indexes)
    cmds:
      - '{{.WORKFLOW}} verify'

  plan:sync:
    desc: Regenerate plan ticket indexes from ticket frontmatter
    cmds:
      - '{{.WORKFLOW}} plan-sync'

  adr:index:
    desc: Regenerate docs/adr/README.md
    cmds:
      - '{{.WORKFLOW}} adr-index'

  ticket:start:
    desc: 'Start a ticket: task ticket:start id=... [plan=...]'
    requires:
      vars: [id]
    cmds:
      - '{{.WORKFLOW}} ticket-start "{{.id}}" "{{.plan | default ""}}"'

  ticket:close:
    desc: 'Close a ticket: task ticket:close id=... [plan=...]'
    requires:
      vars: [id]
    cmds:
      - '{{.WORKFLOW}} ticket-close "{{.id}}" "{{.plan | default ""}}"'

  hooks:install:
    desc: Install git hooks (sets core.hooksPath to .githooks)
    cmds:
      - git config core.hooksPath .githooks

  verify:commits:
    desc: 'Validate commit messages in a range (default: HEAD)'
    cmds:
      - '{{.WORKFLOW}} verify-commits "{{.range | default ""}}"'

  changelog:
    desc: Regenerate CHANGELOG.md with git-cliff
    cmds:
      - git-cliff -o CHANGELOG.md

  version:
    desc: Print the current version (from git tags)
    cmds:
      - '{{.WORKFLOW}} version'

  version:next:
    desc: Print the next CalVer version
    cmds:
      - '{{.WORKFLOW}} version --next'

  release:
    desc: Cut a CalVer release (requires a clean tree and green gates)
    cmds:
      - '{{.WORKFLOW}} release'

  release:dryrun:
    desc: Preview the next release version
    cmds:
      - '{{.WORKFLOW}} release --dry-run'

  new-adr:
    desc: 'Create an ADR: task new-adr title="..."'
    requires:
      vars: [title]
    cmds:
      - 'bash scripts/new-adr.sh "{{.title}}"'

  new-plan:
    desc: 'Create a plan: task new-plan name=... title="..."'
    requires:
      vars: [name]
    cmds:
      - 'bash scripts/new-plan.sh "{{.name}}" "{{.title | default .name}}"'

  new-ticket:
    desc: 'Create a ticket: task new-ticket plan=... title="..."'
    requires:
      vars: [plan, title]
    cmds:
      - 'bash scripts/new-ticket.sh "{{.plan}}" "{{.title}}"'

  new-diary:
    desc: 'Create a diary entry: task new-diary slug=...'
    cmds:
      - 'bash scripts/new-diary.sh "{{.slug | default "session"}}"'
